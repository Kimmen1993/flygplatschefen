<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruket – skiftet</title>
<style>
  :root { --ink: #f3ece2; --muted: #b3a796; --panel: rgba(18,16,14,.9); --line: rgba(255,240,220,.16); --ok: #7ccf8a; --warn: #f2b84b; --bad: #ef6b5b; --fire: #ff8a3c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15120f; color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .hidden { display: none !important; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #top { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; padding: 8px 18px; white-space: nowrap; }
  #top .v { font: 800 22px system-ui; font-variant-numeric: tabular-nums; }
  #top .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  #goalBar { width: 160px; height: 9px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 3px; }
  #goalBar i { display: block; height: 100%; background: var(--warn); width: 0; transition: width .2s; }
  #toast { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); padding: 7px 16px; font-size: 16px; font-weight: 600; pointer-events: none; transition: opacity .3s; }
  .modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(8,6,4,.72); padding: 14px; }
  .modal > .panel { max-width: 640px; width: 100%; padding: 22px 24px; max-height: 100%; overflow-y: auto; text-align: center; }
  .modal h1 { margin: 0 0 4px; font: 700 32px Georgia, serif; }
  .modal h2 { margin: 0 0 6px; font: 700 24px Georgia, serif; }
  .modal .sub { color: var(--muted); margin: 0 0 12px; font-size: 16px; }
  .icons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 14px 0; font-size: 15px; }
  .icons div { width: 120px; padding: 10px 6px; border-radius: 10px; background: rgba(255,240,220,.06); border: 1px solid var(--line); }
  .icons b { display: block; font-size: 34px; line-height: 1.1; margin-bottom: 4px; }
  .go { background: #c2521d; border: 0; color: #fff; font: 700 18px system-ui; padding: 13px 28px; border-radius: 10px; cursor: pointer; }
  .go:hover { background: #d8622a; }
  .sec { background: rgba(255,240,220,.1); border: 1px solid var(--line); color: var(--ink); font: 600 15px system-ui; padding: 10px 18px; border-radius: 10px; cursor: pointer; }
  .stars { color: var(--warn); font-size: 46px; letter-spacing: 6px; }
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 9px; margin: 12px 0; text-align: left; }
  .up { padding: 10px 11px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,240,220,.06); cursor: pointer; color: var(--ink); font: 14px system-ui; text-align: left; }
  .up:hover:not(:disabled) { border-color: var(--fire); }
  .up:disabled { opacity: .45; cursor: default; }
  .up.own { border-color: var(--ok); background: rgba(124,207,138,.12); opacity: 1; }
  .up .ic { font-size: 28px; float: right; }
  .up b { display: block; font-size: 15px; }
  .up span { color: var(--muted); font-size: 12.5px; }
  .up .p { color: var(--warn); font-weight: 700; margin-top: 4px; display: block; }
  .career { display: flex; justify-content: center; gap: 4px; margin: 10px 0 4px; flex-wrap: wrap; }
  .career span { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: rgba(255,255,255,.07); color: var(--muted); }
  .career span.on { background: rgba(242,184,75,.25); color: #ffe2a8; font-weight: 700; }
  .row2 { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  table { margin: 8px auto; border-collapse: collapse; font-size: 15px; } td { padding: 4px 10px; } td.r { text-align: right; font-weight: 700; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top" class="panel hidden">
  <div><div class="l" id="shiftName">Skift 1</div><div class="v" id="clock">4:00</div></div>
  <div><div class="l">Intjänat</div><div class="v" id="earned">0</div><div id="goalBar"><i></i></div></div>
  <div><div class="l">Rykte</div><div class="v" id="rep">★★★</div></div>
</div>
<div id="toast" class="panel" style="opacity:0"></div>

<div id="start" class="modal">
  <div class="panel">
    <h1>Bruket</h1>
    <p class="sub">Driv ett järnbruk. Allt händer samtidigt.</p>
    <div class="icons">
      <div><b>🌲</b>Kola milor<br><small>släck när det ryker</small></div>
      <div><b>🔥</b>Ladda ugnen<br><small>kol + malm</small></div>
      <div><b>⬇</b>Tappa järnet<br><small>håll in</small></div>
      <div><b>🔨</b>Smid i takt<br><small>klicka i grönt</small></div>
      <div><b>🛒</b>Leverera<br><small>innan tiden går</small></div>
    </div>
    <button class="go" id="startBtn">Börja</button>
  </div>
</div>

<div id="brief" class="modal hidden">
  <div class="panel">
    <h2 id="bTitle"></h2>
    <p class="sub" id="bSub"></p>
    <div class="icons" id="bIcons"></div>
    <button class="go" id="bGo">Kör!</button>
  </div>
</div>

<div id="end" class="modal hidden">
  <div class="panel">
    <h2 id="eTitle"></h2>
    <div class="stars" id="eStars"></div>
    <table id="eTable"></table>
    <div class="career" id="career"></div>
    <h2 style="margin-top:14px;font-size:19px">Bygg ut bruket</h2>
    <p class="sub" style="margin:0">Kassa: <b id="cash" style="color:var(--warn)"></b></p>
    <div class="shop" id="shop"></div>
    <div class="row2"><button class="sec" id="retry">Kör skiftet igen</button><button class="go" id="next">Nästa skift →</button></div>
  </div>
</div>

<script>
// Bruket – skiftet: hela bruket på en skärm, allt händer samtidigt. Prototyp 7.
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = n => Math.round(n).toLocaleString('sv-SE');

// ================================================================ karriär & uppgraderingar
const TITLES = [[0, 'Hyttdräng'], [1500, 'Masmästare'], [4000, 'Bruksskrivare'], [8000, 'Inspektor'], [14000, 'Brukspatron']];
const UPS = [
  { id: 'mila3', ic: '🌲', name: 'Tredje milplatsen', d: 'En kolare till i skogen.', p: 250 },
  { id: 'dräng', ic: '🧑‍🌾', name: 'Kolardräng', d: 'Vaktar milorna – hälften så många rökutbrott.', p: 450 },
  { id: 'väg', ic: '🛤️', name: 'Bättre kolväg', d: 'Kolkärrorna går dubbelt så fort.', p: 300 },
  { id: 'bälg', ic: '🪗', name: 'Större bälgar', d: 'Mer bläster – ugnen går fortare och varmare.', p: 500 },
  { id: 'gjutare', ic: '👷', name: 'Gjutare', d: 'Bär tackorna till smedjan åt dig.', p: 400 },
  { id: 'gesäll', ic: '🔨', name: 'Hammargesäll', d: 'Bredare grön zon vid hammaren.', p: 350 },
  { id: 'hammare2', ic: '⚙️', name: 'Andra hammaren', d: 'Smider en tacka själv då och då.', p: 900 },
];
const SHIFTS = [
  { name: 'Första skiftet', pace: 0.55, goal: [180, 300, 420], time: 180, orderEvery: 30, flare: 1, events: [], tip: 'Lär dig grunderna. Kunderna är tålmodiga.' },
  { name: 'Marknadsdag', pace: 0.7, goal: [300, 480, 660], time: 210, orderEvery: 21, flare: 1, events: [{ at: 90, k: 'rush' }], tip: 'Många kunder. Håll smedjan igång.' },
  { name: 'Blåsväder', pace: 0.8, goal: [320, 520, 720], time: 210, orderEvery: 24, flare: 1.8, events: [{ at: 40, k: 'storm' }], tip: 'Vinden får milorna att ryka. Vakta skogen!' },
  { name: 'Torka i ån', pace: 0.9, goal: [400, 620, 840], time: 240, orderEvery: 20, flare: 1.2, events: [{ at: 60, k: 'drought' }, { at: 170, k: 'rain' }], tip: 'Lite vatten = svag bläster. Ugnen blir kall.' },
  { name: 'Kronans beställning', pace: 1, goal: [550, 850, 1150], time: 240, orderEvery: 18, flare: 1.4, events: [{ at: 30, k: 'crown' }, { at: 120, k: 'storm' }], tip: 'En stor order från Kronan. Inget får gå fel.' },
];
const SAVE_KEY = 'bruket7';
function loadSave() { try { return Object.assign({ cash: 0, total: 0, ups: {}, stars: {} }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { return { cash: 0, total: 0, ups: {}, stars: {} }; } }
let SV = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); } catch (e) {} }
const has = id => !!SV.ups[id];

// ================================================================ världen (virtuella koordinater)
const VW = 1600, VH = 780, GY = 700;
const MILA_X = [110, 250, 390];
const SHED = { x: 470, w: 110 };
const FX = 780, FTOP = 330, FBOT = GY;                // masugnen
const SAND = { x: 905, w: 190, slots: 5 };
const SMITH = { x: 1130, w: 230 };
const BARS = { x: 1375 };
const ROAD = { x: 1440 };
const ORE = { x: 690 };

let S;
function newShift(i) {
  const sh = SHIFTS[i];
  S = { i, sh, t: 0, run: false, over: false, earned: 0, rep: 3, missed: 0,
    milor: MILA_X.map((x, k) => ({ x, st: k < 2 || has('mila3') ? 'tom' : 'låst', t: 0, flare: 0, fire: 0, next: 0, yield: 12 })),
    carts: [], coal: 18, ore: 14, layers: [], T: 1400, rc: 0.3, ro: 0.3, hearth: 0, tapping: false, cur: 0, tackor: [], frozen: 0, cold: 0,
    blast: 0.75, blastMax: has('bälg') ? 1 : 0.85, water: 1,
    smith: { q: 0, ph: 'idle', heat: 0, hits: 0, m: 0, flash: 0, miss: 0 }, smith2: 0, bars: 0,
    orders: [], nextOrder: 4, events: sh.events.map(e => ({ ...e })), wind: 1, fx: [], stats: { bars: 0, tackor: 0, delivered: 0, burned: 0, freezes: 0 } };
  let y = 1; while (y > 0.12) { for (const t of ['K', 'M']) { const h = t === 'K' ? 0.07 : 0.045; y -= h; S.layers.push({ t, h, y }); } }
  S.layers.sort((a, b) => b.y - a.y);
  for (let k = 0; k < SAND.slots; k++) S.tackor.push(null);
}

// ================================================================ meddelanden
let toastT = 0;
function toast(t, c = '') { const el = $('toast'); el.textContent = t; el.style.opacity = 1; el.style.borderColor = c === 'bad' ? 'var(--bad)' : c === 'good' ? 'var(--ok)' : 'var(--line)'; toastT = 2.6; }
function pop(x, y, t, col = '#ffe2a8') { S.fx.push({ x, y, t, col, a: 1 }); }

// ================================================================ skogen
function milaClick(m) {
  if (m.st === 'tom') { m.st = 'bygg'; m.t = 0; pop(m.x, GY - 70, 'Reses…'); return; }
  if (m.st === 'kolar' && (m.flare > 0 || m.fire > 0)) { m.flare = 0; m.fire = 0; m.next = rnd(7, 14) / (S.sh.flare * S.wind) * (has('dräng') ? 2 : 1); pop(m.x, GY - 90, 'Tätad!', '#9fe0a8'); return; }
  if (m.st === 'klar') { m.st = 'tom'; S.carts.push({ x: m.x, to: SHED.x + 40, n: m.yield, k: 'kol' }); pop(m.x, GY - 70, `+${m.yield} kol på väg`); }
}
function forestStep(dt) {
  for (const m of S.milor) {
    if (m.st === 'bygg') { m.t += dt; if (m.t > 6) { m.st = 'kolar'; m.t = 0; m.yield = 14; m.next = rnd(4, 9) / S.sh.flare; } }
    else if (m.st === 'kolar') {
      m.t += dt;
      if (m.fire > 0) { m.fire += dt; m.yield = Math.max(0, m.yield - dt * 1.6); if (m.yield <= 0) { m.st = 'tom'; S.stats.burned++; toast('🔥 En mila brann upp!', 'bad'); } }
      else if (m.flare > 0) { m.flare += dt; if (m.flare > 6) { m.fire = 0.01; m.flare = 0; toast('🔥 Milan brinner – klicka på den!', 'bad'); } }
      else { m.next -= dt * S.wind * S.sh.flare / (has('dräng') ? 2 : 1); if (m.next <= 0) m.flare = 0.01; }
      if (m.t > 32 && m.st === 'kolar' && !m.fire) { m.st = 'klar'; m.flare = 0; pop(m.x, GY - 80, 'Klar! Klicka', '#9fe0a8'); }
    }
  }
  for (const c of S.carts) { const v = has('väg') ? 130 : 65; c.x += Math.sign(c.to - c.x) * v * dt; if (Math.abs(c.x - c.to) < 3) { c.done = true; if (c.k === 'kol') { S.coal += c.n; pop(SHED.x + 50, GY - 120, `+${c.n} kol`, '#cfd6e0'); } else cartArrive(c); } }
  S.carts = S.carts.filter(c => !c.done);
  S.ore = Math.min(40, S.ore + dt / 1.3 * S.sh.pace);
}

// ================================================================ masugnen
const topY = () => S.layers.length ? S.layers[S.layers.length - 1].y : 1;
function charge(t) {
  if (!S.run || S.frozen > 0) return;
  if (t === 'K' && S.coal < 1) { toast('Kolhuset är tomt – kola mer!', 'bad'); return; }
  if (t === 'M' && S.ore < 1) { toast('Ingen malm just nu – vänta på gruvan.'); return; }
  const h = t === 'K' ? 0.07 : 0.045;
  if (topY() - h < -0.01) { pop(FX, FTOP - 30, 'Fullt!'); return; }
  if (t === 'K') S.coal--; else S.ore--;
  S.layers.push({ t, h, y: topY() - h, fresh: 1 });
}
function furnaceStep(dt) {
  if (S.frozen > 0) { S.frozen -= dt; S.T += (900 - S.T) * dt; if (S.frozen <= 0) { S.T = 1350; S.hearth = 0; toast('Härden är lagad – ugnen går igen.', 'good'); } return; }
  const bl = Math.min(S.blast, S.blastMax * S.water), v = 0.045 * bl * S.sh.pace;
  for (const L of S.layers) L.y += v * dt;
  let mc = 0, mo = 0;
  while (S.layers.length && S.layers[0].y + S.layers[0].h > 1) {
    const L = S.layers[0], m = Math.min(L.y + L.h - 1, L.h); L.h -= m; L.y = 1 - L.h;
    if (L.t === 'K') mc += m / 0.07; else { mo += m / 0.045; const fe = (m / 0.045) * 2.0 * clamp((S.T - 1150) / 230, 0.3, 1); S.hearth += fe; }
    if (L.h <= 1e-4) S.layers.shift(); else break;
  }
  const k = Math.min(1, dt / 7); S.rc += (mc / dt - S.rc) * k; S.ro += (mo / dt - S.ro) * k;
  const r = S.ro / Math.max(0.03, S.rc), fill = 1 - topY();
  const fuel = clamp(S.rc / (0.6 * 0.39 * bl * S.sh.pace + 0.001), 0, 1);   // 1:1-lastning ger full värme; bara glesa kolsatser sänker
  let target = Math.max(1050, 1000 + fuel * (420 - 190 * (r - 1)) + 220 * (bl - 0.75));
  if (fill < 0.5) target -= (0.5 - fill) * 500;
  if (S.hearth > 26) target -= 170;
  S.T += (target - S.T) * Math.min(1, dt / 4.5);
  if (S.T < 1180) S.cold += dt; else S.cold = Math.max(0, S.cold - dt);
  if (S.cold > 7) { S.frozen = 15; S.cold = 0; S.stats.freezes++; S.layers = []; S.hearth = 0; toast('❄ Härden frös! 15 s stopp. För mycket malm, för lite kol.', 'bad'); refill(); }
  // tappning
  if (S.tapping) {
    if (S.hearth > 0.01) {
      let slot = S.tackor.findIndex(t => t && !t.full); if (slot < 0) slot = S.tackor.findIndex(t => !t);
      if (slot < 0) { S.tapping = false; toast('Sandbädden är full – bär tackorna till smedjan!', 'bad'); return; }
      if (!S.tackor[slot]) S.tackor[slot] = { fill: 0, glow: 1, full: false, grey: S.T >= 1380 };
      const tk = S.tackor[slot], a = Math.min(S.hearth, 5 * dt * (S.T < 1260 ? 0.4 : 1));
      S.hearth -= a; tk.fill += a; tk.glow = 1; if (S.T < 1380) tk.grey = false;
      if (tk.fill >= 4) { tk.fill = 4; tk.full = true; S.stats.tackor++; }
      S.flow = 1;
    } else { S.flow = 2; S.T -= 25 * dt; }
  } else S.flow = 0;
  for (const tk of S.tackor) if (tk) tk.glow = Math.max(0, tk.glow - dt / 6);
  if (has('gjutare')) { const i = S.tackor.findIndex(t => t && t.full && t.glow < 0.05); if (i >= 0 && Math.random() < dt / 2) moveTackor(i); }
}
function refill() { let y = 1; while (y > 0.35) { for (const t of ['K', 'K', 'M']) { const h = t === 'K' ? 0.07 : 0.045; y -= h; S.layers.push({ t, h, y }); } } S.layers.sort((a, b) => b.y - a.y); }
function moveTackor(only) {
  let n = 0;
  S.tackor.forEach((t, i) => { if (t && t.full && t.glow < 0.05 && (only === undefined || only === i)) { S.tackor[i] = null; n++; } });
  if (!n) { const hot = S.tackor.some(t => t && t.full); toast(hot ? 'Tackorna är för varma – vänta tills de grånat.' : 'Inga färdiga tackor än.'); return; }
  S.carts.push({ x: SAND.x + 40, to: SMITH.x + 40, n, k: 'tacka' });
}
function cartArrive(c) { if (c.k === 'tacka') { S.smith.q += c.n; pop(SMITH.x + 80, GY - 160, `+${c.n} tackor`); } }

// ================================================================ smedjan – smid i takt
function smithStep(dt) {
  const sm = S.smith;
  if (sm.flash > 0) sm.flash -= dt * 3;
  if (sm.ph === 'idle' && sm.q > 0 && S.coal >= 1) { sm.q--; S.coal--; sm.ph = 'heat'; sm.heat = 0; sm.hits = 0; }
  if (sm.ph === 'heat') { sm.heat += dt / 2.2; if (sm.heat >= 1) { sm.heat = 1; sm.ph = 'hammer'; sm.m = 0; } }
  if (sm.ph === 'hammer') { sm.m += dt; sm.heat -= dt * 0.09; if (sm.heat < 0.25) { sm.ph = 'heat'; pop(SMITH.x + 110, GY - 180, 'Kallt – värmer om', '#ffb3a8'); } }
  if (has('hammare2')) { S.smith2 += dt; if (S.smith2 > 16 && S.smith.q > 0) { S.smith2 = 0; S.smith.q--; S.bars++; S.stats.bars++; pop(SMITH.x + 200, GY - 140, '+1 stång (gesällen)'); } }
}
function markerPos() { return (Math.sin(S.smith.m * Math.PI * 2 / 1.8 - Math.PI / 2) + 1) / 2; }
function zone() { const w = has('gesäll') ? 0.44 : 0.32; return [0.5 - w / 2, 0.5 + w / 2]; }
function strike() {
  const sm = S.smith; if (!S.run || sm.ph !== 'hammer') return;
  const p = markerPos(), [a, b] = zone();
  if (p >= a && p <= b) { sm.hits++; sm.flash = 1; pop(SMITH.x + 110, GY - 190, 'PANG!', '#ffe2a8');
    if (sm.hits >= 3) { S.bars++; S.stats.bars++; sm.ph = 'idle'; pop(BARS.x + 20, GY - 100, '+1 stångjärn', '#9fe0a8'); } }
  else { sm.miss = 1; sm.heat -= 0.22; pop(SMITH.x + 110, GY - 190, 'miss', '#ffb3a8'); }
}

// ================================================================ kunder
const BUYERS = ['Smeden i byn', 'Skeppare från Gävle', 'Bonden på Näs', 'Spikfabriken', 'Handelshuset', 'Vagnmakaren'];
function orderStep(dt) {
  S.nextOrder -= dt;
  if (S.nextOrder <= 0 && S.orders.length < 3) {
    S.nextOrder = S.sh.orderEvery * rnd(0.8, 1.2);
    const tacka = Math.random() < 0.3, n = tacka ? Math.round(rnd(2, 4)) : Math.round(rnd(1, 3 + S.i * 0.6));
    const T = (tacka ? 60 : 55 + n * 12) * (S.i === 0 ? 1.4 : 1);
    S.orders.push({ who: BUYERS[Math.floor(Math.random() * BUYERS.length)], k: tacka ? 'tacka' : 'bar', n, T, t: T, pay: n * (tacka ? 30 : 65), x: VW + 80 });
  }
  for (const o of S.orders) { o.t -= dt; o.x += ((VW - 162) - o.x) * Math.min(1, dt * 2); if (o.t <= 0 && !o.gone) { o.gone = true; S.rep = Math.max(0, S.rep - 0.5); S.missed++; toast(`${o.who} åkte – du hann inte! Ryktet sjönk.`, 'bad'); } }
  S.orders = S.orders.filter(o => !o.gone);
}
function deliver(o) {
  const stockTackor = S.tackor.filter(t => t && t.full && t.glow < 0.05).length;
  if (o.k === 'bar') { if (S.bars < o.n) return toast(`Behöver ${o.n} stångjärn – du har ${S.bars}.`); S.bars -= o.n; }
  else { if (stockTackor < o.n) return toast(`Behöver ${o.n} kalla tackor i sandbädden – du har ${stockTackor}.`); let n = o.n; S.tackor.forEach((t, i) => { if (n > 0 && t && t.full && t.glow < 0.05) { S.tackor[i] = null; n--; } }); }
  const bonus = o.t / o.T > 0.5 ? 1.2 : 1, pay = Math.round(o.pay * bonus * (0.7 + S.rep * 0.1));
  S.earned += pay; S.stats.delivered++; S.rep = Math.min(3, S.rep + 0.15); o.gone = true;
  pop(ROAD.x + 60, GY - 150, `+${pay} daler${bonus > 1 ? ' (snabbt!)' : ''}`, '#ffd36a');
}

// ================================================================ händelser
function eventStep() {
  for (const e of S.events) if (!e.done && S.t >= e.at) {
    e.done = true;

  g.fillStyle = '#fff'; g.font = '700 15px system-ui'; g.textAlign = 'center'; g.fillText(t, x + w / 2, y + h / 2 + (key ? 0 : 5));
  if (key) { g.font = '11px system-ui'; g.fillStyle = 'rgba(255,255,255,.6)'; g.fillText(holdKey ? `håll · ${key}` : key, x + w / 2, y + h - 7); }
  g.textAlign = 'left';
  HOT.push({ x, y, w, h, f, hold: holdKey });
}

// ================================================================ input
function toV(e) { const r = cv.getBoundingClientRect(); return { x: ((e.clientX - r.left) * dpr - ox) / sc, y: ((e.clientY - r.top) * dpr - oy) / sc }; }
let holding = null;
cv.addEventListener('pointerdown', e => {
  if (!S || !S.run) return; const p = toV(e);
  for (let i = HOT.length - 1; i >= 0; i--) { const h = HOT[i]; if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) {
    if (h.hold === 'tap') { S.tapping = true; holding = 'tap'; } else if (h.f) h.f(); return; } }
});
const release = () => { if (holding === 'tap' && S) S.tapping = false; holding = null; };
addEventListener('pointerup', release); addEventListener('pointercancel', release);
addEventListener('keydown', e => {
  if (!S || !S.run) return; const k = e.key.toLowerCase();
  if (k === 'k' || k === 'a') charge('K'); else if (k === 'm' || k === 'd') charge('M');
  else if (k === 'j') S.tapping = true; else if (k === ' ') { e.preventDefault(); if (!e.repeat) strike(); }
});
addEventListener('keyup', e => { if (S && e.key.toLowerCase() === 'j') S.tapping = false; });

// ================================================================ HUD, skiften, butik
function hud() {
  const left = Math.max(0, S.sh.time - S.t); $('clock').textContent = `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
  $('earned').textContent = `${fmt(S.earned)} d`; $('goalBar').firstElementChild.style.width = `${clamp(S.earned / S.sh.goal[0], 0, 1) * 100}%`;
  $('rep').textContent = '★'.repeat(Math.round(S.rep)) + '☆'.repeat(3 - Math.round(S.rep));
}
function titleOf(total) { let t = TITLES[0][1]; for (const [n, name] of TITLES) if (total >= n) t = name; return t; }
function openBrief(i) {
  newShift(i); $('end').classList.add('hidden'); $('start').classList.add('hidden');
  $('bTitle').textContent = `Skift ${i + 1}: ${SHIFTS[i].name}`; $('bSub').textContent = SHIFTS[i].tip;
  const g0 = SHIFTS[i].goal; $('bIcons').innerHTML = `<div><b>💰</b>Tjäna ${g0[0]} d</div><div><b>⏱</b>${Math.round(SHIFTS[i].time / 60 * 10) / 10} min</div><div><b>★★★</b>${g0[2]} d</div>`;
  $('shiftName').textContent = `Skift ${i + 1} · ${titleOf(SV.total)}`;
  $('brief').classList.remove('hidden'); $('top').classList.remove('hidden'); hud();
}
$('bGo').onclick = () => { $('brief').classList.add('hidden'); S.run = true; if (S.i === 0) setTimeout(() => toast('Börja: klicka "Res mila" i skogen 🌲'), 600); };
$('startBtn').onclick = () => openBrief(Math.min(SHIFTS.length - 1, Object.keys(SV.stars).length));
function endShift() {
  if (S.over) return; S.over = true; S.run = false; S.tapping = false;
  const g0 = S.sh.goal, e = S.earned, st = e >= g0[2] ? 3 : e >= g0[1] ? 2 : e >= g0[0] ? 1 : 0;
  SV.stars[S.i] = Math.max(SV.stars[S.i] || 0, st); SV.cash += e; SV.total += e; persist();
  $('eTitle').textContent = st ? `Skiftet klart!` : 'Inte riktigt…';
  $('eStars').textContent = '★'.repeat(st) + '☆'.repeat(3 - st);
  $('eTable').innerHTML = `<tr><td>💰 Intjänat</td><td class="r">${fmt(e)} d</td></tr><tr><td>🛒 Leveranser · missade</td><td class="r">${S.stats.delivered} · ${S.missed}</td></tr><tr><td>▭ Tackor gjutna · ▬ stångjärn smitt</td><td class="r">${S.stats.tackor} · ${S.stats.bars}</td></tr><tr><td>🔥 Brunna milor · ❄ frusen härd</td><td class="r">${S.stats.burned} · ${S.stats.freezes}</td></tr>`;
  $('career').innerHTML = TITLES.map(([n, name]) => `<span class="${titleOf(SV.total) === name ? 'on' : ''}">${name}${n ? ` ${fmt(n)}` : ''}</span>`).join('');
  $('next').classList.toggle('hidden', !(st > 0 && S.i < SHIFTS.length - 1));
  shop(); $('end').classList.remove('hidden');
}
function shop() {
  $('cash').textContent = `${fmt(SV.cash)} daler`;
  $('shop').innerHTML = UPS.map(u => `<button class="up ${has(u.id) ? 'own' : ''}" data-u="${u.id}" ${has(u.id) || SV.cash < u.p ? 'disabled' : ''}><span class="ic">${u.ic}</span><b>${u.name}</b><span>${u.d}</span><span class="p">${has(u.id) ? '✔ Köpt' : `${u.p} daler`}</span></button>`).join('');
  $('shop').querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const u = UPS.find(x => x.id === b.dataset.u); if (SV.cash >= u.p && !has(u.id)) { SV.cash -= u.p; SV.ups[u.id] = 1; persist(); shop(); } });
}
$('retry').onclick = () => openBrief(S.i);
$('next').onclick = () => openBrief(S.i + 1);

// ================================================================ loop
let last = performance.now(), hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && S.run && !S.over) { const sdt = rdt * (window.__ts || 1), n = Math.ceil(sdt / 0.02); for (let i = 0; i < n && S.run; i++) step(sdt / n); }
  draw(rdt);
  if (toastT > 0) { toastT -= rdt; if (toastT <= 0) $('toast').style.opacity = 0; }
  if (S) { hudT += rdt; if (hudT > 0.1) { hudT = 0; hud(); } }
}
newShift(0); requestAnimationFrame(frame);
window.__b = { get S() { return S; }, charge, strike, deliver, milaClick, moveTackor, openBrief, endShift, SHIFTS, get SV() { return SV; }, markerPos, zone };
</script>
