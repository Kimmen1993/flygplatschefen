<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemma</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app" id="app">
  <aside id="side"></aside>
  <main>
    <div class="top">
      <div class="title"><small id="crumb">HEMMA</small><input id="homeName" spellcheck="false"></div>
      <div class="topRight" id="topRight"></div>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <div class="stage" id="stage">
      <div class="pane" id="pane2d"><canvas id="plan"></canvas></div>
      <div class="pane" id="pane3d"></div>
      <div class="hint" id="hint"></div>
      <div class="zoom" id="zoom2d"><button data-z="1.25">＋</button><button data-z="0.8">－</button><button data-z="fit">⤢</button></div>
    </div>
  </main>
  <section class="right" id="right"></section>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>
<datalist id="ents"></datalist>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
